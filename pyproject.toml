[project]
name = "snapfix"
version = "0.1.0"
description = ""
authors = [
    {name = "Paweł Komendera",email = "pawel.kamil.komendera@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyexiftool (>=0.5.6,<0.6.0)",
    "ffmpeg-python (>=0.2.0,<0.3.0)",
    "pillow (>=12.3.0,<13.0.0)",
    "rich (>=15.0.0,<16.0.0)"
]

[tool.poetry]
packages = [{include = "snapfix", from = "src"}]

[tool.poetry.scripts]
snapfix = "snapfix.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

